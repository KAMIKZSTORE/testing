<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Notifikasi</title>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#0f172a;
      font-family:Arial,sans-serif;
      color:white;
    }

    .card{
      background:#1e293b;
      padding:30px;
      border-radius:20px;
      text-align:center;
      box-shadow:0 0 30px rgba(0,150,255,.4);
      width:300px;
    }

    h1{
      margin-top:0;
      color:#38bdf8;
    }

    button{
      margin-top:20px;
      padding:14px 25px;
      border:none;
      border-radius:12px;
      background:#0ea5e9;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:.3s;
    }

    button:hover{
      transform:scale(1.05);
      background:#0284c7;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>🔔 Test Notifikasi</h1>
  <p>Klik tombol di bawah untuk mencoba notifikasi browser.</p>

  <button onclick="kirimNotif()">
    Kirim Notifikasi
  </button>
</div>

<script>
async function kirimNotif() {
  if (!("Notification" in window)) {
    alert("Browser tidak mendukung notifikasi.");
    return;
  }

  let izin = await Notification.requestPermission();

  if (izin === "granted") {
    new Notification("Ruvera Notification", {
      body: "Notifikasi berhasil dikirim!",
      icon: "https://cdn-icons-png.flaticon.com/512/1827/1827392.png"
    });
  } else {
    alert("Izin notifikasi ditolak.");
  }
}
</script>

</body>
</html>
